name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: tauri system libraries (moor-client-tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # `tauri::generate_context!` embeds `ui/dist` at compile time.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: build ui/dist for moor-client-tauri
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p moor-protocol -p moor-client-core --target wasm32-unknown-unknown
      - run: cargo nextest run --workspace
      - name: benchmark triggers (small scale)
        run: MOOR_BENCH_FILES=2000 cargo bench -p moor-review-core -p moord
      - name: fixtures are up to date
        run: cargo xtask fixtures && git diff --exit-code -- fixtures

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm rescript
      - run: pnpm test
      - run: pnpm vite build

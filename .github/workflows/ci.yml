name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p moor-protocol --target wasm32-unknown-unknown
      - run: cargo nextest run --workspace
      - name: benchmark triggers (small scale)
        run: MOOR_BENCH_FILES=2000 cargo bench -p moor-review-core -p moord
      - name: fixtures are up to date
        run: cargo xtask fixtures && git diff --exit-code -- fixtures

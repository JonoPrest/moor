# Manual, one package at a time. Pick the package and the channels; the version
# comes from its Cargo.toml, and the run refuses to start if that version was
# already released (crates.io has it, or its tag exists).
#
# Secrets, tap layout and the first-release checklist: docs/RELEASING.md.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which binary to release
        type: choice
        required: true
        default: nits
        options: [nits, nitsd, nits-mcp]
      crates_io:
        description: Publish to crates.io
        type: boolean
        default: true
      homebrew:
        description: Update the Homebrew tap
        type: boolean
        default: true
      linux_packages:
        description: Build .deb/.rpm and refresh the APT/YUM repo
        type: boolean
        default: true
      aur:
        description: Push the AUR package
        type: boolean
        default: true
      dry_run:
        description: Build and check everything, publish nothing
        type: boolean
        default: false

# One release at a time: two concurrent runs would race on the tag and the tap.
concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan (${{ inputs.package }})
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      dir: ${{ steps.plan.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so the collision check can see them
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: plan
        name: resolve version and check for a collision
        run: |
          set -euo pipefail
          cargo xtask release-plan --package '${{ inputs.package }}' | tee plan.json
          version=$(jq -r .version plan.json)
          tag=$(jq -r .tag plan.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dir=$(jq -r .dir plan.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .collision plan.json)" = "true" ]; then
            reason=$(jq -r .collision_reason plan.json)
            echo "::error::$reason — bump the version in Cargo.toml before releasing."
            exit 1
          fi
          {
            echo "## Release plan"
            echo
            echo "\`${{ inputs.package }}\` **$version** → tag \`$tag\`"
            echo
            echo "| crate | version | on crates.io |"
            echo "| --- | --- | --- |"
            jq -r '.crates[] | "| \(.name) | \(.version) | \(if .already_published then "yes" else "no" end) |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target: no cross toolchains to keep working.
          # Windows is absent on purpose — nitsd and nits-client-host use
          # std::os::unix unconditionally, so there is nothing to build yet.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # oldest glibc we support
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            musl: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            musl: true
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target '${{ matrix.target }}' --package '${{ inputs.package }}' --bin '${{ inputs.package }}'
      - name: tarball
        id: tarball
        shell: bash
        run: |
          set -euo pipefail
          name='${{ inputs.package }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}'
          staging="dist/$name"
          mkdir -p "$staging"
          cp 'target/${{ matrix.target }}/release/${{ inputs.package }}' "$staging/"
          strip "$staging/${{ inputs.package }}" || true
          cp README.md LICENSE "$staging/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # shasum is the one checksum tool present on both runners.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux-packages:
    name: deb/rpm ${{ matrix.arch }}
    needs: [plan, build]
    if: inputs.linux_packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: incoming
      - name: restage the binary cargo-deb/cargo-generate-rpm expect
        run: |
          set -euo pipefail
          tar -C incoming -xzf incoming/*.tar.gz
          mkdir -p 'target/${{ matrix.target }}/release'
          install -m 0755 \
            'incoming/${{ inputs.package }}-${{ needs.plan.outputs.version }}-${{ matrix.target }}/${{ inputs.package }}' \
            'target/${{ matrix.target }}/release/${{ inputs.package }}'
      - name: build packages
        run: |
          set -euo pipefail
          mkdir -p dist
          # --no-build/--no-strip: reuse the exact binary that was released.
          cargo deb --no-build --no-strip --target '${{ matrix.target }}' --package '${{ inputs.package }}' --output dist/
          cargo generate-rpm --target '${{ matrix.target }}' --package '${{ needs.plan.outputs.dir }}' --output dist/
          ( cd dist && for f in *.deb *.rpm; do shasum -a 256 "$f" > "$f.sha256"; done )
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: tag and GitHub release
    needs: [plan, build, linux-packages]
    # linux-packages is skippable; only a real failure should stop the release.
    if: always() && needs.build.result == 'success' && needs.linux-packages.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - name: collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ( cd dist && shasum -a 256 -- * > SHA256SUMS )
          cat dist/SHA256SUMS
      - name: tag
        if: '!inputs.dry_run'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ needs.plan.outputs.tag }}' -m '${{ inputs.package }} ${{ needs.plan.outputs.version }}'
          git push origin '${{ needs.plan.outputs.tag }}'
      - uses: softprops/action-gh-release@v2
        if: '!inputs.dry_run'
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ inputs.package }} ${{ needs.plan.outputs.version }}
          generate_release_notes: true
          files: dist/*

  crates-io:
    name: crates.io
    needs: [plan, release]
    if: inputs.crates_io && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish the dependency closure in order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo xtask publish --package '${{ inputs.package }}' ${{ inputs.dry_run && '--dry-run' || '' }}

  homebrew:
    name: Homebrew tap
    needs: [plan, release]
    if: inputs.homebrew && !inputs.dry_run && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - name: render the formula
        run: |
          set -euo pipefail
          scripts/render-formula.sh \
            '${{ inputs.package }}' \
            '${{ needs.plan.outputs.version }}' \
            '${{ needs.plan.outputs.tag }}' \
            incoming > formula.rb
          cat formula.rb
      - name: commit to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/JonoPrest/homebrew-nits.git" tap
          mkdir -p tap/Formula
          cp formula.rb 'tap/Formula/${{ inputs.package }}.rb'
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'Formula/${{ inputs.package }}.rb'
          git diff --staged --quiet || git commit -m '${{ inputs.package }} ${{ needs.plan.outputs.version }}'
          git push

  aur:
    name: AUR
    needs: [plan, release]
    if: inputs.aur && !inputs.dry_run && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - name: render PKGBUILD and .SRCINFO
        run: |
          set -euo pipefail
          mkdir -p out
          scripts/render-pkgbuild.sh \
            '${{ inputs.package }}' \
            '${{ needs.plan.outputs.version }}' \
            '${{ needs.plan.outputs.tag }}' \
            incoming out
          cat out/PKGBUILD out/.SRCINFO
      - name: push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone "ssh://aur@aur.archlinux.org/${{ inputs.package }}-bin.git" aur || \
            { mkdir aur && git -C aur init -b master && \
              git -C aur remote add origin "ssh://aur@aur.archlinux.org/${{ inputs.package }}-bin.git"; }
          cp out/PKGBUILD out/.SRCINFO aur/
          cd aur
          git config user.name 'Jono Prest'
          git config user.email 'jjprest@gmail.com'
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m '${{ inputs.package }} ${{ needs.plan.outputs.version }}'
          git push origin master

  linux-repo:
    name: APT/YUM repo
    needs: [plan, release, linux-packages]
    if: inputs.linux_packages && !inputs.dry_run && !failure() && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      # The repo is one gh-pages branch shared by every package.
      group: linux-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c gnupg
      - name: import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')" >> "$GITHUB_ENV"
      - name: rebuild the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" pages \
            || { git clone "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" pages \
                 && git -C pages checkout --orphan gh-pages && git -C pages rm -rf . ; }
          scripts/build-linux-repo.sh pages incoming "$GPG_KEY_ID"
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m 'repo: ${{ inputs.package }} ${{ needs.plan.outputs.version }}'
          git push origin gh-pages

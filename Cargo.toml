[workspace]
resolver = "3"
members = [
    "crates/moor-protocol",
    "crates/moor-protocol-fixtures",
    "crates/moor-review-core",
    "crates/moor-test-support",
    "crates/moord",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
moor-protocol = { path = "crates/moor-protocol" }
moor-protocol-fixtures = { path = "crates/moor-protocol-fixtures" }
moor-review-core = { path = "crates/moor-review-core" }
moor-test-support = { path = "crates/moor-test-support" }
moord = { path = "crates/moord" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", default-features = false }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
anyhow = "1"
proptest = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal", "process", "io-std"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
notify = "8"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Wire enums legitimately vary in size; boxing them would hurt every constructor.
large_enum_variant = "allow"

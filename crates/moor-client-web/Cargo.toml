[package]
name = "moor-client-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dev/test WebSocket bridge around moor-client-host: the browser UI sends dispatch/key/attach as JSON, view patch batches come back. Tauri remains the shipping shell."

[[bin]]
name = "moor-web"
path = "src/main.rs"

[dependencies]
moor-client-core = { workspace = true }
moor-client-host = { workspace = true }
moor-config = { workspace = true }
moord = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.30.0"
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
gethostname = { workspace = true }
fastrand = "2.5.0"
futures-util = "0.3.34"
include_dir = "0.7"

[dev-dependencies]
moor-protocol = { workspace = true }
moor-review-core = { workspace = true }
moor-test-support = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

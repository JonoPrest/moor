[package]
name = "moor-client-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Desktop wrapper: tauri::Builder around moor-client-host. Three commands (dispatch/key/attach) in, `view` events of ViewPatch arrays out."

[[bin]]
name = "moor-desktop"
path = "src/main.rs"

[dependencies]
moor-client-core = { workspace = true }
moor-client-host = { workspace = true }
moor-protocol = { workspace = true }
moor-config = { workspace = true }
moord = { workspace = true }
serde = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
gethostname = { workspace = true }
fastrand = "2.5.0"

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[package]
name = "moor-review-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git access, diffing, anchoring, event store and review logic for Moor. Daemon-only."

[dependencies]
moor-protocol = { workspace = true }
gix = { version = "0.87", default-features = false, features = ["revision", "sha1", "parallel"] }
imara-diff = "0.2"
redb = "4"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
moor-test-support = { workspace = true }
moor-protocol-fixtures = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package]
name = "moor"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Command-line client for the moord code-review daemon"

[[bin]]
name = "moor"
path = "src/main.rs"

[dependencies]
moor-client-web = { path = "../moor-client-web", version = "0.1.0" }
moor-client-host = { workspace = true }
moor-client-core = { workspace = true }
moor-protocol = { workspace = true }
moord = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
gethostname = { workspace = true }
moor-config = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
moor-review-core.workspace = true
moor-test-support.workspace = true
predicates = "3"
serde_json.workspace = true
tempfile = { workspace = true }
tokio-util.workspace = true

[lints]
workspace = true
